<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="94" height="94" x="3" y="3" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5"/>
  
  <!-- Subtle Electric Dot -->
  <circle cx="78" cy="22" r="3.5" fill="#38bdf8" opacity="0.9" />

  <!-- YS Monogram -->
  <text
    x="48"
    y="67"
    font-family="system-ui, -apple-system, 'Space Grotesk', BlinkMacSystemFont, sans-serif"
    font-size="44"
    font-weight="800"
    fill="url(#textGrad)"
    text-anchor="middle"
    letter-spacing="-2"
    filter="url(#glow)"
  >YS</text>
</svg>
